services:
  - type: web
    name: resume-app
    env: python
    buildCommand: |
      pip install -r requirements.txt
      python setup_fonts.py
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin1234
    disk:
      name: data
      mountPath: /opt/render/project/src
      sizeGB: 1
